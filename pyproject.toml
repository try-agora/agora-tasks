[project]
name = "agora-tasks"
version = "0.1.0"
description = "A local Harbor dataset for coding correctness and cross-session knowledge reuse"
requires-python = ">=3.12,<3.14"
dependencies = ["harbor==0.23.0"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
