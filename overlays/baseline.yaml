# No-MCP control: native Harbor settings, independent of the task definitions.
jobs_dir: evals/jobs
n_concurrent_trials: 2
environment:
  type: docker
  extra_allowed_hosts:
    - deb.debian.org
    - raw.githubusercontent.com
    - github.com
    - nodejs.org
    - registry.npmjs.org
agents:
  - name: codex
    model_name: openai/gpt-5.6-luna
    extra_allowed_hosts:
      - chatgpt.com
      - auth.openai.com
      - api.openai.com
    kwargs:
      version: "0.144.3"
      reasoning_effort: low
      web_search: disabled
