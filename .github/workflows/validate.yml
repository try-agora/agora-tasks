name: Validate tasks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.9.30"
          python-version: "3.12"
      - run: uv sync --locked
      - name: Check contracts and verifier discrimination
        run: |
          uv run python scripts/check.py
          uv run python scripts/test_check_job.py
      - name: Execute reference solutions in Harbor
        run: |
          uv run harbor run -p evals -a oracle --env docker --jobs-dir evals/jobs --job-name oracle
          uv run python scripts/check_job.py evals/jobs/oracle --expected 1
      - name: Reject untouched work in Harbor
        run: |
          uv run harbor run -p evals -a nop --env docker --jobs-dir evals/jobs --job-name baseline
          uv run python scripts/check_job.py evals/jobs/baseline --expected 0
